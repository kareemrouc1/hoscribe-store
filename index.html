<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>هوسكرايب · المتجر</title>
  <meta name="description" content="متجر هوسكرايب — اعرض منتجك وتواصل مع المشترين." />
  <meta name="robots" content="noindex, follow" />
  <link rel="canonical" href="https://hoscribe.netlify.app/brand.html" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="هوسكرايب · المتجر" />
  <meta property="og:description" content="متجر هوسكرايب — اعرض منتجك وتواصل مع المشترين." />
  <meta property="og:image" content="logo.png" />
  <link rel="icon" href="logo.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet" />

  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

    :root{
      --bg:#f5f5f7;
      --surface:#ffffff;
      --text-primary:#1d1d1f;
      --text-secondary:#6e6e73;
      --text-tertiary:#8e8e93;
      --gold:#b8953a;
      --border:#e3e3e6;
      --radius:16px;
      --radius-sm:10px;
      --transition:.3s cubic-bezier(.25,.1,.15,1);
      --shadow:0 8px 30px rgba(0,0,0,.05);
      --shadow-hover:0 12px 40px rgba(0,0,0,.09);
      --max-width:1100px;
    }

    html{scroll-behavior:smooth;-webkit-font-smoothing:antialiased}

    body{
      font-family:'Cairo',-apple-system,BlinkMacSystemFont,sans-serif;
      background:var(--bg);
      background-image:radial-gradient(1200px 600px at 50% -10%, rgba(184,149,58,.05), transparent 60%);
      color:var(--text-primary);
      line-height:1.7;
      min-height:100vh;
      padding:2.4rem 1.6rem;
      display:flex;
      flex-direction:column;
      align-items:center;
    }

    .container{
      max-width:var(--max-width);
      width:100%;
      margin:0 auto;
      display:flex;
      flex-direction:column;
      flex:1;
      opacity:0;
      transition:opacity .35s ease;
    }
    body.ready .container{opacity:1}

    /* ===== Boot loader ===== */
    .loader{
      position:fixed;
      inset:0;
      z-index:60;
      display:flex;
      align-items:center;
      justify-content:center;
      background:var(--bg);
      transition:opacity .35s ease;
    }
    .loader.hide{opacity:0;pointer-events:none}
    .spinner{
      width:34px;height:34px;
      border:2.5px solid var(--border);
      border-top-color:var(--gold);
      border-radius:50%;
      animation:spin .8s linear infinite;
    }
    @keyframes spin{to{transform:rotate(360deg)}}

    /* ===== Top bar ===== */
    .top-bar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:1rem;
      padding-bottom:1rem;
      border-bottom:1px solid var(--border);
      margin-bottom:3rem;
    }

    .brand-link{
      display:inline-flex;
      align-items:center;
      gap:.55rem;
      font-size:.82rem;
      font-weight:600;
      color:var(--text-secondary);
      text-decoration:none;
      padding:.45rem .9rem;
      border-radius:40px;
      border:1px solid transparent;
      transition:var(--transition);
    }
    .brand-link:hover{
      color:var(--text-primary);
      background:var(--surface);
      border-color:var(--border);
      box-shadow:var(--shadow);
    }
    .brand-link svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

    .top-actions{
      display:flex;
      align-items:center;
      gap:.7rem;
    }

    .top-meta{
      font-size:.72rem;
      font-weight:400;
      color:var(--text-tertiary);
      letter-spacing:.02em;
    }

    /* ===== Profile button ===== */
    .profile-btn{
      width:40px;
      height:40px;
      flex:0 0 auto;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      background:var(--surface);
      border:1px solid var(--border);
      border-radius:50%;
      color:var(--text-secondary);
      text-decoration:none;
      transition:var(--transition);
      -webkit-tap-highlight-color:transparent;
    }
    .profile-btn:hover,
    .profile-btn:focus-visible{
      color:var(--gold);
      border-color:rgba(184,149,58,.45);
      box-shadow:var(--shadow);
      transform:translateY(-1px);
      outline:none;
    }
    .profile-btn:active{transform:translateY(0)}
    .profile-btn svg{
      width:19px;height:19px;
      stroke:currentColor;fill:none;
      stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;
    }
    .profile-btn img{
      width:100%;height:100%;
      object-fit:cover;
      border-radius:50%;
      display:block;
    }
    .profile-btn img[hidden]{display:none}

    /* ===== Store header ===== */
    .store-header{
      text-align:center;
      padding:1.5rem 0 3rem;
    }

    .brand-mark{
      width:64px;
      height:64px;
      margin:0 auto 1.2rem;
      display:flex;
      align-items:center;
      justify-content:center;
      background:var(--surface);
      border:1px solid var(--border);
      border-radius:20px;
      box-shadow:var(--shadow);
      color:var(--gold);
    }
    .brand-mark svg{width:30px;height:30px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}

    .store-header h1{
      font-size:2.4rem;
      font-weight:700;
      letter-spacing:-.02em;
      margin-bottom:.4rem;
    }
    .store-header p{
      color:var(--text-secondary);
      font-size:.95rem;
      font-weight:300;
    }

    /* ===== Empty / placeholder state ===== */
    .state-box{
      flex:1;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:4rem 1.5rem;
      background:var(--surface);
      border:1px solid var(--border);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      margin-bottom:2.5rem;
      min-height:340px;
    }

    .state-icon{
      width:80px;
      height:80px;
      margin-bottom:1.4rem;
      display:flex;
      align-items:center;
      justify-content:center;
      background:var(--bg);
      border-radius:24px;
      color:var(--text-tertiary);
    }
    .state-icon svg{width:38px;height:38px;stroke:currentColor;fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}

    .state-title{
      font-size:1.1rem;
      font-weight:700;
      margin-bottom:.35rem;
    }
    .state-sub{
      font-size:.85rem;
      font-weight:300;
      color:var(--text-secondary);
      max-width:340px;
    }

    /* ===== Footer ===== */
    .footer{
      padding:2rem 0 1rem;
      text-align:center;
    }
    .footer .signoff{
      font-size:.85rem;
      font-weight:300;
      color:var(--text-secondary);
      margin-bottom:.4rem;
    }
    .footer .credit{
      font-size:.68rem;
      font-weight:300;
      color:var(--text-tertiary);
      letter-spacing:.02em;
    }

    /* ===== Responsive ===== */
    @media(max-width:780px){
      .store-header h1{font-size:1.9rem}
      .store-header{padding:1rem 0 2.2rem}
      .top-bar{margin-bottom:2rem}
    }

    @media(max-width:520px){
      body{padding:1.5rem .9rem}
      .store-header h1{font-size:1.6rem}
      .top-meta{display:none}
      .state-box{padding:3rem 1rem;min-height:280px}
      .brand-mark{width:56px;height:56px;border-radius:18px}
      .brand-mark svg{width:26px;height:26px}
      .profile-btn{width:38px;height:38px}
    }

    ::-webkit-scrollbar{width:4px;height:4px}
    ::-webkit-scrollbar-track{background:var(--bg)}
    ::-webkit-scrollbar-thumb{background:var(--border);border-radius:10px}
  </style>
</head>
<body>

  <!-- Loader أثناء التحقق من الجلسة -->
  <div class="loader" id="bootLoader"><div class="spinner"></div></div>

  <div class="container">

    <!-- Top bar -->
    <div class="top-bar">
      <a href="https://hoscribe.vercel.app" target="_blank" rel="noopener" class="brand-link">
        <svg viewBox="0 0 24 24">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" />
          <path d="M15 3h6v6" />
          <path d="M10 14 21 3" />
        </svg>
        <span>Hoscribe Page</span>
      </a>

      <div class="top-actions">
        <span class="top-meta">المتجر الرسمي</span>

        <!-- زر الملف الشخصي -->
        <a href="profile.html" class="profile-btn" id="profileBtn" aria-label="الملف الشخصي" title="الملف الشخصي">
          <svg id="userIcon" viewBox="0 0 24 24">
            <circle cx="12" cy="8" r="3.6" />
            <path d="M4.5 20a7.5 7.5 0 0 1 15 0" />
          </svg>
          <img id="avatarImg" alt="صورة الملف الشخصي" hidden />
        </a>
      </div>
    </div>

    <!-- Store header -->
    <header class="store-header">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24">
          <path d="M3 9l1.5-5h15L21 9" />
          <path d="M3 9v10a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1V9" />
          <path d="M3 9h18" />
          <path d="M9 13a3 3 0 0 0 6 0" />
        </svg>
      </div>
      <h1>متجر هوسكرايب</h1>
      <p>منصة أنيقة لعرض المنتجات والتواصل مع البائعين</p>
    </header>

    <!-- Placeholder state -->
    <div class="state-box">
      <div class="state-icon">
        <svg viewBox="0 0 24 24">
          <path d="M21 8l-9-5-9 5v8l9 5 9-5V8z" />
          <path d="M3.3 7 12 12l8.7-5" />
          <path d="M12 22V12" />
        </svg>
      </div>
      <p class="state-title">لا توجد منتجات بعد</p>
      <p class="state-sub">سيتم عرض المنتجات هنا قريباً — هذه نسخة أولية جاهزة للتطوير.</p>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <p class="signoff">— وجودكم معنا هو كل شيء، نتمنى أن تستمتعوا دائماً —</p>
      <p class="credit">© 2025 Hoscribe · هوسكرايب — كريم محمد إسماعيل</p>
    </footer>

  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    /* ======== عدّل هنا فقط ======== */
    const SUPABASE_URL      = 'https://cbnpuovgauozhgspgqlz.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNibnB1b3ZnYXVvemhnc3BncWx6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMxMDA4MTcsImV4cCI6MjEwODY3NjgxN30.proBbLxsY2irQ_wbHIdv9v1mIR9V8GprrwcaRhRFCNs';
    /* =============================== */

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
    });

    const loader    = document.getElementById('bootLoader');
    const avatarImg = document.getElementById('avatarImg');
    const userIcon  = document.getElementById('userIcon');

    const goRegister = () => location.replace('register.html');

    function showPage() {
      document.body.classList.add('ready');
      loader.classList.add('hide');
      setTimeout(() => loader.remove(), 400);
    }

    function paintAvatar(user) {
      const url = user?.user_metadata?.avatar_url || user?.user_metadata?.picture;
      if (url) {
        avatarImg.src = url;
        avatarImg.hidden = false;
        userIcon.style.display = 'none';
      }
    }

    (async () => {
      try {
        const { data: { session }, error } = await supabase.auth.getSession();
        if (error || !session) return goRegister();

        paintAvatar(session.user);
        showPage();

        // لو خرج من الحساب في تاب آخر → رجّعه للتسجيل
        supabase.auth.onAuthStateChange((event, s) => {
          if (event === 'SIGNED_OUT' || !s) goRegister();
        });
      } catch (err) {
        console.error(err);
        goRegister();
      }
    })();
  </script>

</body>
</html>
