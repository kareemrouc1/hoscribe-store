<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>هوسكرايب · تسجيل الدخول</title>
  <meta name="description" content="سجّل الدخول أو أنشئ حساباً في هوسكرايب باستخدام Google أو Apple." />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="logo.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet" />

  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

    :root{
      --bg:#f5f5f7;
      --surface:#ffffff;
      --text-primary:#1d1d1f;
      --text-secondary:#6e6e73;
      --text-tertiary:#8e8e93;
      --gold:#b8953a;
      --border:#e3e3e6;
      --radius:20px;
      --radius-sm:12px;
      --transition:.3s cubic-bezier(.25,.1,.15,1);
      --shadow:0 8px 30px rgba(0,0,0,.05);
      --shadow-hover:0 12px 40px rgba(0,0,0,.09);
    }

    html{scroll-behavior:smooth;-webkit-font-smoothing:antialiased}

    body{
      font-family:'Cairo',-apple-system,BlinkMacSystemFont,sans-serif;
      background:var(--bg);
      background-image:radial-gradient(1200px 600px at 50% -10%, rgba(184,149,58,.06), transparent 60%);
      color:var(--text-primary);
      line-height:1.7;
      min-height:100vh;
      min-height:100dvh;
      padding:2.4rem 1.4rem;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
    }

    .container{
      width:100%;
      max-width:420px;
      margin:0 auto;
      display:flex;
      flex-direction:column;
      flex:1;
      justify-content:center;
      opacity:0;
      transform:translateY(8px);
      transition:opacity .4s ease, transform .4s ease;
    }
    body.ready .container{opacity:1;transform:none}

    /* ===== Boot loader ===== */
    .loader{
      position:fixed;
      inset:0;
      z-index:60;
      display:flex;
      align-items:center;
      justify-content:center;
      background:var(--bg);
      transition:opacity .35s ease;
    }
    .loader.hide{opacity:0;pointer-events:none}
    .spinner{
      width:34px;height:34px;
      border:2.5px solid var(--border);
      border-top-color:var(--gold);
      border-radius:50%;
      animation:spin .8s linear infinite;
    }
    @keyframes spin{to{transform:rotate(360deg)}}

    /* ===== Header ===== */
    .auth-head{
      text-align:center;
      padding:0 0 1.8rem;
    }

    .brand-mark{
      width:60px;
      height:60px;
      margin:0 auto 1.1rem;
      display:flex;
      align-items:center;
      justify-content:center;
      background:var(--surface);
      border:1px solid var(--border);
      border-radius:19px;
      box-shadow:var(--shadow);
      color:var(--gold);
    }
    .brand-mark svg{
      width:28px;height:28px;
      stroke:currentColor;fill:none;
      stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;
    }

    .auth-head h1{
      font-size:1.5rem;
      font-weight:700;
      letter-spacing:-.02em;
      margin-bottom:.35rem;
    }
    .auth-head p{
      font-size:.85rem;
      font-weight:300;
      color:var(--text-secondary);
      max-width:330px;
      margin:0 auto;
    }

    /* ===== Card ===== */
    .card{
      background:var(--surface);
      border:1px solid var(--border);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:1.6rem 1.4rem 1.4rem;
    }

    .card-label{
      font-size:.72rem;
      font-weight:600;
      color:var(--text-tertiary);
      letter-spacing:.02em;
      text-align:center;
      margin-bottom:1rem;
    }

    .oauth-stack{
      display:flex;
      flex-direction:column;
      gap:.7rem;
    }

    /* ===== OAuth buttons ===== */
    .oauth-btn{
      position:relative;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:.65rem;
      width:100%;
      min-height:52px;
      padding:.7rem 1rem;
      font-family:inherit;
      font-size:.9rem;
      font-weight:600;
      color:var(--text-primary);
      background:var(--surface);
      border:1px solid var(--border);
      border-radius:var(--radius-sm);
      cursor:pointer;
      transition:var(--transition);
      -webkit-tap-highlight-color:transparent;
    }
    .oauth-btn:hover:not(:disabled){
      border-color:#d3d3d9;
      box-shadow:var(--shadow);
      transform:translateY(-1px);
    }
    .oauth-btn:active:not(:disabled){transform:translateY(0);box-shadow:none}
    .oauth-btn:focus-visible{
      outline:none;
      border-color:rgba(184,149,58,.55);
      box-shadow:0 0 0 3px rgba(184,149,58,.14);
    }
    .oauth-btn:disabled{
      cursor:not-allowed;
      opacity:.55;
    }

    .oauth-icon{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      width:19px;
      height:19px;
      flex:0 0 auto;
    }
    .oauth-icon svg{width:100%;height:100%;display:block}

    .oauth-label{white-space:nowrap}

    /* spinner inside button */
    .btn-spinner{
      display:none;
      width:16px;height:16px;
      flex:0 0 auto;
      border:2px solid var(--border);
      border-top-color:var(--gold);
      border-radius:50%;
      animation:spin .8s linear infinite;
    }
    .oauth-btn.loading .btn-spinner{display:inline-block}
    .oauth-btn.loading .oauth-icon{display:none}
    .oauth-btn.loading .oauth-label{opacity:.6}

    /* ===== Error ===== */
    .error{
      margin-top:.9rem;
      padding:.6rem .8rem;
      font-size:.78rem;
      font-weight:400;
      color:#a3231b;
      background:#fdf1f0;
      border:1px solid #f4d6d3;
      border-radius:10px;
      text-align:center;
    }
    .error[hidden]{display:none}

    /* ===== Hint ===== */
    .hint{
      margin-top:1.1rem;
      font-size:.7rem;
      font-weight:300;
      line-height:1.8;
      color:var(--text-tertiary);
      text-align:center;
    }
    .hint a{
      color:var(--text-secondary);
      text-decoration:none;
      border-bottom:1px solid var(--border);
      transition:var(--transition);
    }
    .hint a:hover{color:var(--gold);border-color:rgba(184,149,58,.5)}

    /* ===== Footer ===== */
    .footer{
      padding:2.2rem 0 .5rem;
      text-align:center;
    }
    .footer .signoff{
      font-size:.82rem;
      font-weight:300;
      color:var(--text-secondary);
      margin-bottom:.35rem;
    }
    .footer .credit{
      font-size:.66rem;
      font-weight:300;
      color:var(--text-tertiary);
      letter-spacing:.02em;
    }

    /* ===== Responsive ===== */
    @media(max-width:520px){
      body{padding:1.8rem 1rem}
      .auth-head h1{font-size:1.3rem}
      .card{padding:1.4rem 1.1rem 1.2rem}
      .oauth-btn{font-size:.85rem;min-height:50px}
      .brand-mark{width:54px;height:54px;border-radius:17px}
      .brand-mark svg{width:25px;height:25px}
    }

    @media (prefers-reduced-motion: reduce){
      *{animation-duration:.01ms !important;transition-duration:.01ms !important}
    }

    ::-webkit-scrollbar{width:4px;height:4px}
    ::-webkit-scrollbar-track{background:var(--bg)}
    ::-webkit-scrollbar-thumb{background:var(--border);border-radius:10px}
  </style>
</head>
<body>

  <!-- Loader أثناء التحقق من الجلسة -->
  <div class="loader" id="bootLoader"><div class="spinner"></div></div>

  <main class="container">

    <!-- Header -->
    <header class="auth-head">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24">
          <path d="M3 9l1.5-5h15L21 9" />
          <path d="M3 9v10a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1V9" />
          <path d="M3 9h18" />
          <path d="M9 13a3 3 0 0 0 6 0" />
        </svg>
      </div>
      <h1>مرحباً بك في هوسكرايب</h1>
      <p>تابع باستخدام حسابك — خطوة واحدة وتبدأ رحلتك معنا.</p>
    </header>

    <!-- Card -->
    <section class="card">
      <p class="card-label">المتابعة باستخدام</p>

      <div class="oauth-stack">

        <!-- Google -->
        <button class="oauth-btn" type="button" data-provider="google">
          <span class="btn-spinner" aria-hidden="true"></span>
          <span class="oauth-icon" aria-hidden="true">
            <svg viewBox="0 0 48 48">
              <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
              <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
              <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.28-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
              <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
            </svg>
          </span>
          <span class="oauth-label">المتابعة باستخدام Google</span>
        </button>

        <!-- Apple -->
        <button class="oauth-btn" type="button" data-provider="apple">
          <span class="btn-spinner" aria-hidden="true"></span>
          <span class="oauth-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="#1d1d1f">
              <path d="M16.37 1.43c0 1.14-.42 2.2-1.26 3.03-.9.9-2.02 1.4-3.13 1.31-.03-1.13.44-2.24 1.26-3.06.86-.86 2.1-1.4 3.13-1.28zM20.9 17.1c-.36.83-.79 1.6-1.3 2.3-.68.94-1.24 1.59-1.68 1.95-.68.62-1.4.94-2.18.96-.56 0-1.23-.16-2.02-.48-.79-.32-1.51-.48-2.17-.48-.7 0-1.44.16-2.24.48-.8.32-1.45.49-1.95.5-.75.03-1.49-.3-2.22-.99-.48-.4-1.07-1.08-1.77-2.04-.75-1.03-1.37-2.22-1.85-3.58C.52 14.4.26 13.12.26 11.88c0-1.42.31-2.64.92-3.67a5.4 5.4 0 0 1 1.94-1.96 5.23 5.23 0 0 1 2.62-.74c.6 0 1.39.19 2.37.55.98.36 1.6.55 1.88.55.2 0 .9-.22 2.07-.65 1.11-.4 2.05-.57 2.81-.5 2.07.17 3.63.99 4.66 2.46-1.85 1.12-2.77 2.7-2.75 4.71.02 1.57.59 2.88 1.7 3.92.5.48 1.06.85 1.69 1.11-.14.4-.28.78-.44 1.15z"/>
            </svg>
          </span>
          <span class="oauth-label">المتابعة باستخدام Apple</span>
        </button>

      </div>

      <p class="error" id="errorBox" role="alert" aria-live="polite" hidden></p>

      <p class="hint">
        بالمتابعة أنت توافق على <a href="#">شروط الاستخدام</a> و<a href="#">سياسة الخصوصية</a>.
      </p>
    </section>

    <!-- Footer -->
    <footer class="footer">
      <p class="signoff">— وجودكم معنا هو كل شيء، نتمنى أن تستمتعوا دائماً —</p>
      <p class="credit">© 2025 Hoscribe · هوسكرايب — كريم محمد إسماعيل</p>
    </footer>

  </main>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    /* ======== عدّل هنا فقط ======== */
    const SUPABASE_URL      = 'https://cbnpuovgauozhgspgqlz.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNibnB1b3ZnYXVvemhnc3BncWx6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMxMDA4MTcsImV4cCI6MjEwODY3NjgxN30.proBbLxsY2irQ_wbHIdv9v1mIR9V8GprrwcaRhRFCNs';
    /* =============================== */

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
    });

    const AFTER_LOGIN = new URL('index.html', document.baseURI).href;

    const loader   = document.getElementById('bootLoader');
    const errorBox = document.getElementById('errorBox');
    const buttons  = [...document.querySelectorAll('.oauth-btn')];

    /* ---------- UI helpers ---------- */
    function showPage() {
      document.body.classList.add('ready');
      loader.classList.add('hide');
      setTimeout(() => loader.remove(), 400);
    }

    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.hidden = false;
    }
    function clearError() {
      errorBox.hidden = true;
      errorBox.textContent = '';
    }

    function setBusy(provider, busy) {
      buttons.forEach(btn => {
        const isTarget = btn.dataset.provider === provider;
        btn.disabled = busy;
        btn.classList.toggle('loading', busy && isTarget);
        btn.setAttribute('aria-busy', String(busy && isTarget));
      });
    }

    /* ---------- رسائل خطأ راجعة من المزوّد ---------- */
    function readCallbackError() {
      const q = new URLSearchParams(location.search);
      const h = new URLSearchParams(location.hash.replace(/^#/, ''));
      const raw = q.get('error_description') || q.get('error')
               || h.get('error_description') || h.get('error');
      if (!raw) return null;

      // تنظيف العنوان حتى لا تتكرر الرسالة عند التحديث
      history.replaceState(null, '', location.pathname);

      const map = {
        access_denied: 'تم إلغاء عملية تسجيل الدخول.',
        invalid_request: 'طلب غير صالح، حاول مرة أخرى.',
        server_error: 'حدث خطأ في الخادم، حاول لاحقاً.',
        temporarily_unavailable: 'الخدمة غير متاحة مؤقتاً، حاول لاحقاً.'
      };
      const key = String(raw).toLowerCase();
      for (const k in map) {
        if (key.includes(k)) return map[k];
      }
      return 'تعذّر إكمال تسجيل الدخول، حاول مرة أخرى.';
    }

    /* ---------- بدء OAuth ---------- */
    async function startOAuth(provider) {
      if (buttons.some(b => b.disabled)) return;

      clearError();
      setBusy(provider, true);

      try {
        const { error } = await supabase.auth.signInWithOAuth({
          provider,
          options: {
            redirectTo: AFTER_LOGIN,
            queryParams: provider === 'google'
              ? { prompt: 'select_account' }
              : undefined
          }
        });

        // في حالة النجاح يتم التحويل تلقائياً — لا نعيد تفعيل الأزرار
        if (error) throw error;
      } catch (err) {
        console.error(err);
        setBusy(provider, false);
        showError(
          provider === 'apple'
            ? 'تعذّر الاتصال بحساب Apple. تأكد من إعداد المزوّد ثم حاول مجدداً.'
            : 'تعذّر الاتصال بحساب Google. تحقّق من الاتصال ثم حاول مجدداً.'
        );
      }
    }

    buttons.forEach(btn => {
      btn.addEventListener('click', () => startOAuth(btn.dataset.provider));
    });

    /* ---------- التحقق من الجلسة عند الدخول ---------- */
    (async () => {
      const cbError = readCallbackError();

      try {
        const { data: { session } } = await supabase.auth.getSession();

        if (session) {
          // مسجّل دخول بالفعل → المتجر مباشرة
          location.replace('index.html');
          return;
        }

        if (cbError) showError(cbError);
        showPage();
      } catch (err) {
        console.error(err);
        if (cbError) showError(cbError);
        showPage();
      }
    })();
  </script>

</body>
</html>
